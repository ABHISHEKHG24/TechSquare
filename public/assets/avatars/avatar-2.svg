<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#1e1145" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="150" y1="100" x2="450" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="skinGrad2" x1="250" y1="160" x2="350" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#e9d5ff" />
    </linearGradient>
    <radialGradient id="glow2" cx="300" cy="240" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090514" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#bgGrad2)" />
  <circle cx="300" cy="240" r="240" fill="url(#glow2)" />

  <!-- Neural Network Constellation Lines -->
  <g opacity="0.3" stroke="#c084fc" stroke-width="1.5">
    <line x1="120" y1="150" x2="200" y2="100" />
    <line x1="200" y1="100" x2="270" y2="140" />
    <line x1="400" y1="120" x2="480" y2="160" />
    <line x1="480" y1="160" x2="520" y2="240" />
    <line x1="80" y1="320" x2="160" y2="380" />
    <line x1="480" y1="360" x2="530" y2="440" />
  </g>
  <g fill="#e9d5ff">
    <circle cx="120" cy="150" r="4" />
    <circle cx="200" cy="100" r="5" />
    <circle cx="270" cy="140" r="3.5" />
    <circle cx="400" cy="120" r="4" />
    <circle cx="480" cy="160" r="5.5" />
    <circle cx="520" cy="240" r="4" />
  </g>

  <!-- AI Pulse Ring -->
  <circle cx="300" cy="250" r="185" stroke="url(#accentGrad2)" stroke-width="2.5" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="300" cy="250" r="202" stroke="#a855f7" stroke-width="1" opacity="0.3" />

  <!-- Character -->
  <g filter="url(#shadow2)">
    <!-- Tech Jacket -->
    <path d="M140 550 C150 430 210 390 260 380 L340 380 C390 390 450 430 460 550 Z" fill="#180e36" stroke="#4c1d95" stroke-width="2.5" />
    <!-- Cyber Lapel -->
    <path d="M260 380 L290 470 L300 550 L310 470 L340 380 Z" fill="#2e1065" />
    <line x1="300" y1="420" x2="300" y2="540" stroke="#c084fc" stroke-width="2" />

    <!-- Neck -->
    <rect x="278" y="320" width="44" height="68" rx="8" fill="url(#skinGrad2)" />

    <!-- Head -->
    <rect x="235" y="170" width="130" height="165" rx="65" fill="url(#skinGrad2)" />

    <!-- Hair -->
    <path d="M225 210 C225 130 260 115 305 115 C350 115 375 135 375 190 C360 185 340 185 320 185 C290 185 260 195 225 210 Z" fill="#2e1065" />
    <path d="M230 180 C250 135 295 125 350 135 C330 125 280 130 250 160 Z" fill="#c084fc" opacity="0.7" />

    <!-- Headset Earpiece / Cyber Audio -->
    <rect x="220" y="225" width="15" height="36" rx="7" fill="#a855f7" stroke="#e9d5ff" stroke-width="2" />
    <path d="M228 261 Q245 285 268 285" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
    <circle cx="272" cy="285" r="4" fill="#a855f7" />

    <!-- Eyes (Focused Expression) -->
    <rect x="256" y="235" width="22" height="7" rx="3.5" fill="#3b0764" />
    <rect x="322" y="235" width="22" height="7" rx="3.5" fill="#3b0764" />

    <!-- Subtle Beard / Chin -->
    <path d="M260 280 Q300 325 340 280 Q300 310 260 280 Z" fill="#3b0764" opacity="0.3" />
    <path d="M285 295 Q300 302 315 295" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- AI Brain / Sparkle Badge -->
  <g transform="translate(420, 110)">
    <circle cx="36" cy="36" r="34" fill="#180e36" stroke="#c084fc" stroke-width="2.5" />
    <!-- Sparkle Symbol -->
    <path d="M36 20 L39 31 L50 36 L39 41 L36 52 L33 41 L22 36 L33 31 Z" fill="#c084fc" />
  </g>
</svg>
