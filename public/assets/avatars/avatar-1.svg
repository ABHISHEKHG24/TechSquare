<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="150" y1="100" x2="450" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="skinGrad1" x1="250" y1="160" x2="350" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <radialGradient id="glow1" cx="300" cy="240" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#bgGrad1)" />
  <circle cx="300" cy="240" r="240" fill="url(#glow1)" />

  <!-- Code/Tech Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="60" y1="120" x2="540" y2="120" stroke-dasharray="8 8" />
    <line x1="60" y1="240" x2="540" y2="240" stroke-dasharray="8 8" />
    <line x1="60" y1="360" x2="540" y2="360" stroke-dasharray="8 8" />
    <line x1="60" y1="480" x2="540" y2="480" stroke-dasharray="8 8" />
    <line x1="160" y1="60" x2="160" y2="540" stroke-dasharray="8 8" />
    <line x1="300" y1="60" x2="300" y2="540" stroke-dasharray="8 8" />
    <line x1="440" y1="60" x2="440" y2="540" stroke-dasharray="8 8" />
  </g>

  <!-- Tech Circle Badge Halo -->
  <circle cx="300" cy="250" r="180" stroke="url(#accentGrad1)" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.6" />
  <circle cx="300" cy="250" r="198" stroke="#38bdf8" stroke-width="1" opacity="0.3" />

  <!-- Stylized Developer Silhouette Character -->
  <g filter="url(#shadow1)">
    <!-- Shoulders / Hoodie Body -->
    <path d="M140 550 C150 430 210 390 260 380 L340 380 C390 390 450 430 460 550 Z" fill="#0f172a" stroke="#334155" stroke-width="2.5" />
    <!-- Hoodie Inner Collar -->
    <path d="M255 380 L300 450 L345 380 Z" fill="#1e293b" />
    <path d="M285 430 L300 450 L315 430 Z" fill="#0284c7" />

    <!-- Neck -->
    <rect x="278" y="320" width="44" height="68" rx="8" fill="url(#skinGrad1)" />

    <!-- Head -->
    <rect x="235" y="170" width="130" height="165" rx="65" fill="url(#skinGrad1)" />

    <!-- Modern Haircut -->
    <path d="M225 210 C225 140 270 120 310 120 C355 120 375 145 375 185 C375 198 365 205 350 205 C330 205 315 195 295 195 C275 195 245 205 225 210 Z" fill="#1e293b" />
    <path d="M228 190 C240 145 290 135 345 142 C320 132 265 142 240 170 Z" fill="#38bdf8" opacity="0.7" />

    <!-- Minimalist Glasses -->
    <rect x="245" y="222" width="46" height="32" rx="8" fill="none" stroke="#0284c7" stroke-width="4.5" />
    <rect x="309" y="222" width="46" height="32" rx="8" fill="none" stroke="#0284c7" stroke-width="4.5" />
    <line x1="291" y1="238" x2="309" y2="238" stroke="#0284c7" stroke-width="4" />
    <line x1="230" y1="234" x2="245" y2="234" stroke="#0284c7" stroke-width="3" />
    <line x1="355" y1="234" x2="370" y2="234" stroke="#0284c7" stroke-width="3" />

    <!-- Glasses Lens Glint -->
    <path d="M252 230 L275 230" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M316" y="230" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Smile / Chin -->
    <path d="M285 290 Q300 298 315 290" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Floating Code Icon Badge -->
  <g transform="translate(420, 110)">
    <circle cx="36" cy="36" r="34" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <text x="36" y="44" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
